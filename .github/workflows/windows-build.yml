name: Test and Build Desktop Candidates

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'work/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Branch, tag or commit (empty = this workflow commit)'
        required: false
        default: ''
      candidate_version:
        description: 'Build both candidates for exact app version; empty = tests only'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      candidate: ${{ steps.source.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - id: source
        name: Resolve one commit and version for both platforms
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.candidate_version }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          version=re.search(r'__version__\s*=\s*["\']([^"\']+)',Path('app/__init__.py').read_text()).group(1)
          requested=os.environ.get('REQUESTED_VERSION','')
          ref=os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/v'):
              requested=ref.removeprefix('refs/tags/v')
          if requested and (not re.fullmatch(r'\d+\.\d+\.\d+',requested) or requested != version):
              raise SystemExit('Tag/candidate version must equal app version')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'commit={sha}\nversion={version}\ncandidate={str(bool(requested)).lower()}\n')
          PY

  desktop:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos
            architecture: arm64
          - runner: windows-2022
            target: windows
            architecture: x64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-build-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Install pinned dependencies in the disposable runner
        run: |
          python -m pip install --only-binary=:all: -r requirements-build-lock.txt
      - name: Dependency and asset preflight
        run: python -B build_scripts/build_preflight.py
      - name: Dependency consistency
        run: python -m pip check
      - name: Tracked source audit
        run: python -B build_scripts/windows_release_audit.py --source . --repository
      - name: Isolated Python tests
        run: python -B run_tests.py -v
      - name: Calculator contract tests
        run: node --test tests/test_expected_rate_web.cjs
      - name: Build Mac candidate
        if: needs.source.outputs.candidate == 'true' && matrix.target == 'macos'
        run: bash build_scripts/build_mac.sh
      - name: Pack Mac candidate
        if: needs.source.outputs.candidate == 'true' && matrix.target == 'macos'
        run: bash build_scripts/pack_mac.sh
      - name: Run frozen Mac synthetic QA
        if: needs.source.outputs.candidate == 'true' && matrix.target == 'macos'
        timeout-minutes: 5
        run: |
          dist/Goedu-Split.app/Contents/MacOS/Goedu-Split --synthetic-qa "$RUNNER_TEMP/goedusplit-candidate-qa"
      - name: Build Windows candidate
        if: needs.source.outputs.candidate == 'true' && matrix.target == 'windows'
        shell: cmd
        run: build_scripts\build_windows.bat
      - name: Pack Windows portable
        if: needs.source.outputs.candidate == 'true' && matrix.target == 'windows'
        shell: cmd
        run: build_scripts\pack_windows.bat
      - name: Run frozen Windows synthetic QA
        if: needs.source.outputs.candidate == 'true' && matrix.target == 'windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $qaRoot = Join-Path $env:RUNNER_TEMP 'goedusplit-candidate-qa'
          $process = Start-Process -FilePath '.\dist\Goedu-Split\Goedu-Split.exe' -ArgumentList @('--synthetic-qa', ('"' + $qaRoot + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen candidate QA failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $qaRoot 'QA_REPORT.json'))) { throw 'Candidate QA report missing' }
      - name: Pack Windows setup (preinstalled Inno Setup required)
        if: needs.source.outputs.candidate == 'true' && matrix.target == 'windows'
        shell: cmd
        run: build_scripts\pack_windows_installer.bat
      - name: Verify outputs and collect provenance
        if: needs.source.outputs.candidate == 'true'
        env:
          CANDIDATE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python -B build_scripts/release_manifest.py --version "$CANDIDATE_VERSION" --commit "$SOURCE_COMMIT" --target "$TARGET" --qa-report "$RUNNER_TEMP/goedusplit-candidate-qa/QA_REPORT.json" --output artifacts
      - uses: actions/upload-artifact@v4
        if: needs.source.outputs.candidate == 'true'
        with:
          name: candidate-${{ matrix.target }}-${{ needs.source.outputs.commit }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  pair:
    needs: [source, desktop]
    if: needs.source.outputs.candidate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*-${{ needs.source.outputs.commit }}
          path: candidates
          merge-multiple: true
      - name: Verify both commits, versions, required files and checksums
        env:
          VERSION: ${{ needs.source.outputs.version }}
          COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 -B build_scripts/release_manifest.py --version "$VERSION" --commit "$COMMIT" --verify-pair candidates
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidates-${{ needs.source.outputs.version }}-${{ needs.source.outputs.commit }}
          path: candidates/*
          if-no-files-found: error
          retention-days: 14
