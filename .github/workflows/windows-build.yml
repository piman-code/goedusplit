name: Build Windows Distribution

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag, or commit to build"
        required: false
        default: "main"
  push:
    tags:
      - "windows-v*"

jobs:
  build-windows:
    name: Build Windows zip and setup
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 테스트가 __pycache__를 만들기 전에 소스를 검사한다.
      - name: Privacy audit (source)
        shell: cmd
        run: python build_scripts\privacy_release_audit.py app tests build_scripts distribution docs README.md SECURITY.md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # cmd 단계는 마지막 명령의 결과만 보므로 테스트는 단계를 나눈다.
      - name: Python tests
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      - name: Calculator web tests
        shell: cmd
        run: node --test tests/test_expected_rate_web.cjs

      - name: Prepare fonts and icons
        shell: cmd
        run: |
          python build_scripts\fetch_fonts.py
          python build_scripts\generate_app_icon.py

      - name: Build executable
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist
          pyinstaller --noconfirm --clean goedusplit.spec

      - name: Privacy audit (built app)
        shell: cmd
        run: python build_scripts\privacy_release_audit.py dist\Goedu-Split

      - name: Pack portable zip
        shell: cmd
        run: build_scripts\pack_windows.bat

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Pack setup installer
        shell: cmd
        continue-on-error: true
        run: build_scripts\pack_windows_installer.bat

      - name: Collect artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item dist\Goedu-Split-*-windows.zip artifacts\
          if (Test-Path dist\Goedu-Split-*-windows-setup.exe) {
            Copy-Item dist\Goedu-Split-*-windows-setup.exe artifacts\
          }
          Copy-Item distribution\USER_GUIDE.md artifacts\사용_안내.md

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goedusplit-windows-distribution
          path: artifacts/*
          retention-days: 14
